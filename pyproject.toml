[tool.poetry]
name = "project-neto-time-completion"
version = "1.0.0"
description = "Учебный ML-проект по анализу и прогнозированию временных рядов"
authors = ["AndreyBers"]
readme = "README.md"
packages = [{ include = "time_series_project", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^1.26.4"
pandas = "^2.2.2"
scikit-learn = "^1.5.1"
statsmodels = "^0.14.2"
matplotlib = "^3.9.1"
statsforecast = "^1.7.8"
mlforecast = "^0.13.4"

[tool.poetry.group.dl]
optional = true

[tool.poetry.group.dl.dependencies]
neuralforecast = "^1.7.4"
torch = ">=2.2,<3.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-cov = "^5.0.0"
pre-commit = "^3.8.0"
ruff = "^0.6.4"
black = "^24.8.0"
mypy = "^1.11.2"
pandas-stubs = "^2.2.2.240807"
jupyter = "^1.1.1"

[tool.poetry.scripts]
ts-pipeline = "time_series_project.cli:main"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
exclude = "notebook"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = ["notebook", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["time_series_project"]

[tool.mypy]
python_version = "3.10"
files = ["src/time_series_project"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/time_series_project"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
